services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: w2w-backend:latest
    container_name: w2w-backend
    hostname: backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8083}:8080"
      - "${DISCOVERY_PORT:-8888}:8888/udp"
    environment:
      - SERVER_PORT=8080
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - W2W_STORAGE_MAX_QUOTA_BYTES=53687091200
      - W2W_SESSION_TIMEOUT_SECONDS=600
      - W2W_STORAGE_TEMP_DIR=/app/temp-w2w-encrypted
      - JAVA_OPTS=-XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0
    volumes:
      - w2w_temp_data:/app/temp-w2w-encrypted
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      w2w-network:
        aliases:
          - backend
          - w2w-share

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: w2w-frontend:latest
    container_name: w2w-frontend
    hostname: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8084}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 64M
    networks:
      - w2w-network

networks:
  w2w-network:
    driver: bridge

volumes:
  w2w_temp_data:
    name: w2w_temp_data
    driver: local
