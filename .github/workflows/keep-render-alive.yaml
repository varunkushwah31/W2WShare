name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier from sleeping (15-min idle timeout)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping Render Service
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Heartbeat
        env:
          CONFIGURED_URL: ${{ vars.RENDER_APP_URL || secrets.RENDER_APP_URL || vars.RENDER_URL || secrets.RENDER_URL || '' }}
        run: |
          TARGET_URL="${CONFIGURED_URL:-https://w2w-share-backend.onrender.com}"
          TARGET_URL="${TARGET_URL%/}"

          echo "Target service: $TARGET_URL"
          echo "Pinging health endpoints to prevent instance sleep..."

          # Ping actuator health endpoint, fallback to root / if actuator does not return 200
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --retry 2 --retry-delay 5 --max-time 60 "$TARGET_URL/actuator/health" || echo "000")

          if [ "$HTTP_CODE" != "200" ]; then
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --retry 2 --retry-delay 5 --max-time 30 "$TARGET_URL/" || echo "$HTTP_CODE")
          fi

          echo "Response code: $HTTP_CODE"

          case "$HTTP_CODE" in
            200)
              echo "✅ Render instance is active and warm! (HTTP 200)"
              ;;
            502|503|504)
              echo "ℹ️ Render instance is waking up from sleep (HTTP $HTTP_CODE). Keep-alive ping successfully reached Render!"
              ;;
            404)
              echo "::warning title=Render Service 404::Received HTTP 404 from '$TARGET_URL'. If your Render service has a different URL, set the 'RENDER_APP_URL' secret or repository variable in GitHub."
              ;;
            000)
              echo "::warning title=Connection Timeout::Could not reach '$TARGET_URL' within timeout. Render may still be spinning up."
              ;;
            *)
              echo "ℹ️ Keep-alive ping sent to $TARGET_URL (HTTP $HTTP_CODE)."
              ;;
          esac
