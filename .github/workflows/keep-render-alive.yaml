name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier from sleeping (15-min timeout)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Instance
        run: |
          URL="${{ secrets.RENDER_APP_URL || 'https://w2w-share.onrender.com' }}"
          echo "Pinging $URL..."
          curl -f -s -S --retry 3 --max-time 60 "$URL/api/network/health" || curl -f -s -S --retry 2 --max-time 60 "$URL/"
          echo "✅ Render instance is active and warm!"
