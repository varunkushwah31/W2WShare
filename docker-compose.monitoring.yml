services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: w2w-backend:latest
    container_name: w2w-backend
    hostname: backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8083}:8080"
      - "${DISCOVERY_PORT:-8888}:8888/udp"
    environment:
      - SERVER_PORT=8080
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - W2W_STORAGE_MAX_QUOTA_BYTES=53687091200
      - W2W_SESSION_TIMEOUT_SECONDS=600
      - W2W_STORAGE_TEMP_DIR=/app/temp-w2w-encrypted
      - JAVA_OPTS=-XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0
    volumes:
      - w2w_temp_data:/app/temp-w2w-encrypted
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      w2w-network:
        aliases:
          - backend
          - w2w-share

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: w2w-frontend:latest
    container_name: w2w-frontend
    hostname: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8084}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - w2w-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: w2w-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - w2w-network
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.4.0
    container_name: w2w-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - w2w-network
    depends_on:
      - prometheus

networks:
  w2w-network:
    driver: bridge

volumes:
  w2w_temp_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
