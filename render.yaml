# Render Blueprint Specification for W2W-Share Backend
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: w2w-share-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,https://*.vercel.dev"
      - key: FRONTEND_URL
        sync: false
      - key: JAVA_OPTS
        value: "-XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0 -Dspring.threads.virtual.enabled=true"
