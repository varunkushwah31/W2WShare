# Production Server Configuration & Virtual Threads
server.port=8080
server.address=0.0.0.0
spring.threads.virtual.enabled=true

# High-Performance HTTP Response Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Tomcat High-Concurrency Connection Pooling
server.tomcat.max-connections=10000
server.tomcat.accept-count=1000
server.tomcat.connection-timeout=20000

# Ephemeral Encrypted Storage Settings
w2w.storage.temp-dir=./temp-w2w-encrypted
w2w.session.timeout-seconds=600
w2w.storage.cleanup-interval-ms=30000
w2w.storage.max-quota-bytes=53687091200
w2w.storage.min-free-disk-bytes=1073741824

# Spring Boot Actuator & Prometheus Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true

# High-Volume File Upload Multipart Constraints
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Jackson Serialization
spring.jackson.serialization.indent-output=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Production Logging Configuration
logging.level.root=INFO
logging.level.com.w2w.share=DEBUG
logging.level.org.springframework.web.socket=INFO
