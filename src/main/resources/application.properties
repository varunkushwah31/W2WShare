# Production Server Configuration & Virtual Threads
server.port=${PORT:8080}
server.address=0.0.0.0
spring.threads.virtual.enabled=true

# Cross-Origin & Frontend Cloud URLs
w2w.security.allowed-origins=${CORS_ALLOWED_ORIGINS:}
w2w.frontend-url=${FRONTEND_URL:}
w2w.public-url=${PUBLIC_URL:}
spring.jpa.open-in-view=false
spring.web.resources.add-mappings=false

# High-Performance HTTP Response Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Tomcat High-Concurrency Connection Pooling
server.tomcat.max-connections=10000
server.tomcat.accept-count=1000
server.tomcat.connection-timeout=120000
server.tomcat.max-swallow-size=-1

# Ephemeral Encrypted Storage Settings
w2w.storage.temp-dir=./temp-w2w-encrypted
w2w.session.timeout-seconds=600
w2w.storage.max-quota-bytes=53687091200
w2w.storage.min-free-disk-bytes=1073741824

# Spring Boot Actuator & Prometheus Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true

# Multipart Constraints (Safe: client-side AES-256-GCM encrypted 2MB chunks with 64MB buffer safety ceiling and 50MB vault ceiling)
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB

# Jackson Serialization
spring.jackson.serialization.indent-output=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Production Logging Configuration & Logback Properties
logging.level.root=INFO
logging.level.com.w2w.share=${LOG_LEVEL_W2W:INFO}
logging.level.org.springframework.web.socket=INFO
logging.file.name=logs/w2w-share.log
logging.file.path=logs
